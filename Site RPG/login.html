<!DOCTYPE html>

        <nav class="menu">
            <ul class="menu-links">

          </nav>

    <div class="container-form">
        <form id="loginForm">

            <label for="email">E-mail:</label>
            <input type="email" id="email" required>
            <span class="error" id="emailError"></span>

            <label for="password">Senha:</label>
            <input type="password" id="password" required>

            <button class="cadastrar" type="submit" id="loginBtn">Entrar</button>

        </form>
        <img src="img/mago.png" alt="O PODEROSO MAGO">
    </div>
    <footer>
        <div class="footer-logo">
            <img src="img/logo-drungeons.png" alt="Logo do site">
            <div class="title-logo-footer">
                <h2>Drungeons</h2>
            </div>
        </div>
        <ul class="footer-links">
            <li><a href="sobre.html">Sobre</a></li>

            <li><a href="">Termos e Condições</a></li>
            <li><a href="">Discord <i class="icon-discord"></i></a></li>

        </ul>
