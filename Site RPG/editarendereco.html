<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Editar Endereço</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="shortcut icon" href="img/dragão.png" type="image/x-icon">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body>
    <header>
        <nav class="menu">
            <ul class="menu-links">
                <li><a href="index.html">Home</a></li>
                <li> <a href="Sobre.html">Sobre</a></li>
                <li><a href="">Perfil</a></li>
                <li><a href="endereco.html">Cad. Endereço</a></li>
            </ul>
        </nav>
    </header>
    <div class="container mt-5">
        <h2 class="mb-4 text-center">Editar Endereço</h2>

        <form id="formEditarEndereco" class="card p-4 shadow">
            <input type="hidden" id="enderecoId" />

            <div class="mb-3">
                <label for="title" class="form-label">Título</label>
                <input type="text" class="form-control" id="title" required />
            </div>

            <div class="mb-3">
                <label for="cep" class="form-label">CEP</label>
                <input type="text" class="form-control" id="cep" required />
            </div>

            <div class="mb-3">
                <label for="address" class="form-label">Endereço</label>
                <input type="text" class="form-control" id="address" required />
            </div>

            <div class="mb-3">
                <label for="number" class="form-label">Número</label>
                <input type="text" class="form-control" id="number" required />
            </div>

            <div class="mb-3">
                <label for="complement" class="form-label">Complemento (opcional)</label>
                <input type="text" class="form-control" id="complement" />
            </div>

            <div class="d-flex justify-content-between">
                <button type="submit" class="btn btn-success" id="salvar_alter">Salvar Alterações</button>
                <a href="endereco.html" class="btn btn-secondary" id="Cancelar_btt">Cancelar</a>
            </div>
        </form>
    </div>

    <footer>
        <div class="footer-logo">
            <img src="img/logo-drungeons.png" alt="Logo do site">
            <div class="title-logo-footer">
                <h2>Drungeons</h2>
            </div>
        </div>
        <ul class="footer-links">
            <li><a href="sobre.html">Sobre</a></li>
            <li><a href="">Fale Conosco</a></li>
            <li><a href="">Termos e Condições</a></li>
            <li><a href="">Discord <i class="icon-discord"></i></a></li>
            <li><a href="">GitHub <i class="icon-github"></i></a></li>
        </ul>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/editarendereco.js"></script>
</body>

</html>
