<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Editar Endereço</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="shortcut icon" href="img/dragão.png" type="image/x-icon">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body>
    <header>
        <nav class="menu">
            <ul class="menu-links">
                <li><a href="index.html">Home</a></li>
                <li> <a href="Sobre.html">Sobre</a></li>
                <li><a href="">Perfil</a></li>
                <li><a href="endereco.html">Cad. Endereço</a></li>
            </ul>
        </nav>
    </header>
    <div class="container mt-5">
        <h2 class="mb-4 text-center">Editar Endereço</h2>

        <form id="formEditarEndereco" class="card p-4 shadow">
            <input type="hidden" id="enderecoId" />

            <div class="mb-3">
                <label for="title" class="form-label">Título</label>
                <input type="text" class="form-control" id="title" required />
            </div>

            <div class="mb-3">
                <label for="cep" class="form-label">CEP</label>
                <input type="text" class="form-control" id="cep" required />
            </div>

            <div class="mb-3">
                <label for="address" class="form-label">Endereço</label>
                <input type="text" class="form-control" id="address" required />
            </div>

            <div class="mb-3">
                <label for="number" class="form-label">Número</label>
                <input type="text" class="form-control" id="number" required />
            </div>

            <div class="mb-3">
                <label for="complement" class="form-label">Complemento (opcional)</label>
                <input type="text" class="form-control" id="complement" />
            </div>

            <div class="d-flex justify-content-between">
                <button type="submit" class="btn btn-success">Salvar Alterações</button>
                <a href="enderecos.html" class="btn btn-secondary">Cancelar</a>
            </div>
        </form>
    </div>

    <script>
        // Carregar dados do endereço no formulário
        document.addEventListener("DOMContentLoaded", () => {
            const endereco = JSON.parse(localStorage.getItem("enderecoEdit"));
            if (!endereco) {
                alert("Endereço não encontrado.");
                window.location.href = "enderecos.html";
                return;
            }

            document.getElementById("enderecoId").value = endereco.id;
            document.getElementById("title").value = endereco.title;
            document.getElementById("cep").value = endereco.cep;
            document.getElementById("address").value = endereco.address;
            document.getElementById("number").value = endereco.number;
            document.getElementById("complement").value = endereco.complement || "";
        });

        // Enviar atualização
        document.getElementById("formEditarEndereco").addEventListener("submit", async (e) => {
            e.preventDefault();

            const user = JSON.parse(localStorage.getItem("userData"));
            if (!user || !user.access_token) {
                alert("Usuário não autenticado.");
                return;
            }

            const id = document.getElementById("enderecoId").value;
            const enderecoAtualizado = {
                title: document.getElementById("title").value,
                cep: document.getElementById("cep").value,
                address: document.getElementById("address").value,
                number: document.getElementById("number").value,
                complement: document.getElementById("complement").value
            };

            try {
                const response = await fetch(`https://go-wash-api.onrender.com/api/auth/address/${id}`, {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json",
                        "Authorization": `Bearer ${user.access_token}`
                    },
                    body: JSON.stringify(enderecoAtualizado)
                });

                if (response.ok) {
                    alert("Endereço atualizado com sucesso!");
                    localStorage.removeItem("enderecoEdit");
                    window.location.href = "endereco.html";
                } else {
                    alert("Erro ao atualizar o endereço.");
                }
            } catch (error) {
                console.error("Erro ao atualizar:", error);
                alert("Erro inesperado.");
            }
        });
    </script>
    <footer>
        <div class="footer-logo">
            <img src="img/logo-drungeons.png" alt="Logo do site">
            <div class="title-logo-footer">
                <h2>Drungeons</h2>
            </div>
        </div>
        <ul class="footer-links">
            <li><a href="sobre.html">Sobre</a></li>
            <li><a href="">Fale Conosco</a></li>
            <li><a href="">Termos e Condições</a></li>
            <li><a href="">Discord <i class="icon-discord"></i></a></li>
            <li><a href="">GitHub <i class="icon-github"></i></a></li>
        </ul>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
